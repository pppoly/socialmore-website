<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>過去 | SOCIALMORE</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c-bg: #ffffff;
      --c-bg2: #f5f5f3;
      --c-surface: #ffffff;
      --c-text: #1a1a1a;
      --c-muted: #6b6b6b;
      --c-hint: #a0a0a0;
      --c-border: rgba(0,0,0,0.09);
      --c-border-strong: rgba(26,95,168,0.22);
      --c-info-text: #1a5fa8;
      --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.04);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-xl: 24px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: linear-gradient(180deg, #ffffff, #f7f7f5 78%);
      color: var(--c-text);
      line-height: 1.6;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 40px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 0.5px solid var(--c-border);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: .75rem;
      color: var(--c-text);
      flex-shrink: 0;
    }

    .nav-logo-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-logo-mark img {
      width: 26px;
      height: auto;
      display: block;
    }

    .nav-logo-text {
      display: flex;
      flex-direction: column;
      font-size: .85rem;
      line-height: 1.1;
      white-space: nowrap;
    }

    .nav-logo-jp { font-weight: 600; }
    .nav-logo-en { font-size: .7rem; letter-spacing: .15em; color: var(--c-muted); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-item {
      position: relative;
    }

    .nav-item::after {
      content: '';
      position: absolute;
      top: 100%;
      left: -12px;
      right: -12px;
      height: 16px;
    }

    .nav-link-main,
    .nav-links > a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--c-muted);
      transition: background .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease;
    }

    .nav-links > a:hover,
    .nav-link-main[aria-current="page"],
    .nav-item:hover .nav-link-main,
    .nav-item:focus-within .nav-link-main {
      color: var(--c-text);
      background: rgba(26,95,168,0.06);
      border-color: rgba(26,95,168,0.10);
      box-shadow: 0 8px 18px rgba(26,95,168,0.08);
    }

    .nav-link-main {
      gap: 8px;
    }

    .nav-link-main::after {
      content: '';
      width: 7px;
      height: 7px;
      border-right: 1.5px solid var(--c-hint);
      border-bottom: 1.5px solid var(--c-hint);
      transform: translateY(-2px) rotate(45deg);
      transition: transform .2s ease, border-color .2s ease;
    }

    .nav-item:hover .nav-link-main::after,
    .nav-item:focus-within .nav-link-main::after {
      border-color: var(--c-text);
      transform: translateY(1px) rotate(225deg);
    }

    .nav-submenu {
      position: absolute;
      top: calc(100% + 14px);
      left: 50%;
      min-width: 248px;
      padding: 10px;
      border: 1px solid rgba(26,95,168,0.10);
      border-radius: 16px;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(11, 28, 46, 0.10), 0 4px 10px rgba(11, 28, 46, 0.04);
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(10px) scale(0.98);
      transform-origin: top center;
      transition: opacity .22s ease, transform .22s ease;
    }

    .nav-submenu::before {
      content: '';
      position: absolute;
      top: -7px;
      left: 50%;
      width: 12px;
      height: 12px;
      background: rgba(255,255,255,0.98);
      border-top: 1px solid rgba(26,95,168,0.10);
      border-left: 1px solid rgba(26,95,168,0.10);
      transform: translateX(-50%) rotate(45deg);
    }

    .nav-submenu a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--c-text);
      white-space: nowrap;
      text-decoration: none;
      border-bottom: none;
      box-shadow: none;
    }

    .nav-submenu a::after {
      content: '';
      width: 7px;
      height: 7px;
      border-top: 1.5px solid var(--c-hint);
      border-right: 1.5px solid var(--c-hint);
      transform: rotate(45deg);
      transition: transform .2s ease, border-color .2s ease;
    }

    .nav-submenu a:hover {
      background: var(--c-bg2);
      color: var(--c-text);
    }

    .nav-submenu a:hover::after {
      border-color: var(--c-text);
      transform: translateX(2px) rotate(45deg);
    }

    .nav-submenu a[aria-current="page"] {
      background: var(--c-bg2);
      color: var(--c-text);
    }

    .nav-submenu a[aria-current="page"]::after {
      border-color: var(--c-text);
    }

    .nav-item:hover .nav-submenu,
    .nav-item:focus-within .nav-submenu {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    .shell {
      width: min(1240px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 64px;
    }

    .section {
      display: grid;
      gap: 12px;
      margin-bottom: 24px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }

    .section-title {
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: -.02em;
    }

    .section-note {
      color: var(--c-muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .section-link {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      color: var(--c-info-text);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .section-link::before {
      content: '';
      width: 8px;
      height: 8px;
      border-left: 1.5px solid var(--c-hint);
      border-bottom: 1.5px solid var(--c-hint);
      transform: rotate(45deg);
    }

    .page-footer {
      margin-top: 56px;
      background: linear-gradient(180deg, #eef4fb, #f8fbff);
      color: var(--c-text);
      padding: 40px 24px 28px;
      border-top: 1px solid var(--c-border);
    }

    .footer-inner {
      width: min(1240px, calc(100% - 40px));
      margin: 0 auto;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 28px;
      margin-bottom: 20px;
    }

    .footer-column {
      display: grid;
      gap: 8px;
    }

    .footer-brand {
      display: inline-flex;
      align-items: center;
      gap: .75rem;
      min-width: 0;
    }

    .footer-brand .nav-logo-mark {
      width: 42px;
      height: 42px;
    }

    .footer-brand .nav-logo-text {
      font-size: .85rem;
    }

    .footer-brand .nav-logo-en {
      color: var(--c-muted);
    }

    .footer-text {
      font-size: 14px;
      line-height: 1.8;
      color: var(--c-muted);
    }

    .footer-text span {
      color: var(--c-hint);
      margin-right: 6px;
    }

    .footer-copy {
      border-top: 1px solid var(--c-border);
      padding-top: 14px;
      font-size: 12px;
      color: var(--c-hint);
    }

    @media (max-width: 640px) {
      .shell {
        width: min(100% - 24px, 1240px);
        padding: 24px 0 36px;
      }

      .nav {
        padding: 12px 20px;
      }

      .nav-links {
        display: none;
      }

      .page-footer {
        margin-top: 40px;
        padding: 32px 20px 24px;
      }

      .footer-inner {
        width: min(100%, 1240px);
      }
    }
  </style>
</head>

  <script>
    document.querySelectorAll('.nav-item a').forEach((link) => {
      link.addEventListener('click', () => {

          if (document.activeElement instanceof HTMLElement) {

          }
        });
